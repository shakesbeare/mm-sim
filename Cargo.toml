[package]
name = "mm_sim"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.ultra]
inherits = "release"
codegen-units = 1
lto = "fat"

[dependencies]
bevy = { version="0.18.1", default-features=false, features=["bevy_log"] }
bevy_math = { version="0.18.1", features=["curve"] }
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
anyhow = "1.0.100"
rand = "0.9.2"
rand_distr = "0.5.1"
thiserror = "2.0.17"
tracing-subscriber = "0.3.23"
crossterm = "0.29.0"
textplots = "0.8.7"
rgb = "0.8.53"
tracing-appender = "0.2.4"
chrono = "0.4.44"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.149"
skillratings = { version = "0.28.2", features = ["serde"] }
extra_collections = "0.1.3"
tracing = "0.1.44"
ctrlc = "3.5.2"
